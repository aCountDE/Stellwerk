<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Modellbahn Stellwerk – Prototyp</title>
<style>
    :root {
        --bg: #121212;
        --panel: rgba(17,17,17,0.7);
        --accent: #1e88e5;
        --accent2: #00ff66;
        --text: #e0e0e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
    }
    #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        position: relative;
        background: #1a1a1a;
    }
    /* Canvas-Bereich */
    #canvasContainer {
        flex: 1;
        position: relative;
        overflow: hidden;
    }
    #trackCanvas {
        background: #1a1a1a;
        width: 100%;
        height: 100%;
        display: block;
    }

    /* Overlay-Sidebar */
    #sidebar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 320px;
        background: var(--panel);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 0 25px rgba(0,0,0,0.6);
        transform: translateX(-260px);
        transition: transform 0.3s ease-out;
        padding: 10px;
        display: flex;
        flex-direction: column;
        z-index: 10;
    }
    #sidebar.open {
        transform: translateX(0);
    }
    #sidebarHandle {
        position: absolute;
        top: 50%;
        right: -40px;
        width: 40px;
        height: 80px;
        background: var(--panel);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-radius: 0 10px 10px 0;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }
    #sidebarHandle span {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        font-size: 12px;
        color: var(--text);
    }

    h2 {
        font-size: 16px;
        margin: 8px 0 4px;
    }
    label {
        font-size: 12px;
        display: block;
        margin: 4px 0;
    }
    input, select {
        width: 100%;
        padding: 4px 6px;
        margin-top: 2px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #222;
        color: var(--text);
        font-size: 12px;
    }
    button {
        padding: 6px 10px;
        margin: 4px 0;
        border-radius: 4px;
        border: none;
        background: var(--accent);
        color: white;
        font-size: 12px;
        cursor: pointer;
    }
    button.secondary {
        background: #333;
    }
    button:active {
        transform: scale(0.97);
    }
    .row {
        display: flex;
        gap: 6px;
    }
    .row > * {
        flex: 1;
    }
    #modeIndicator {
        margin-top: 4px;
        font-size: 12px;
        color: #aaa;
    }
    #objectList {
        flex: 1;
        overflow-y: auto;
        margin-top: 6px;
        border-top: 1px solid #333;
        padding-top: 4px;
        font-size: 12px;
    }
    .objItem {
        padding: 4px;
        border-radius: 4px;
        margin-bottom: 3px;
        background: #222;
        cursor: pointer;
    }
    .objItem.active {
        outline: 1px solid var(--accent2);
    }
    #footerBar {
        position: absolute;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 5;
    }
    #footerBar button {
        font-size: 12px;
    }
</style>
</head>
<body>
<div id="app">
    <div id="canvasContainer">
        <canvas id="trackCanvas"></canvas>
    </div>

    <div id="sidebar">
        <div id="sidebarHandle"><span>MENÜ</span></div>

        <h2>Verbindung</h2>
        <label>Arduino IP
            <input id="ipInput" type="text" placeholder="z.B. 192.168.0.50">
        </label>
        <label>Globale Impulsdauer (ms)
            <input id="globalPulse" type="number" min="50" max="200" value="200">
        </label>

        <h2>Modus</h2>
        <div class="row">
            <button id="editBtn">Edit</button>
            <button id="runBtn" class="secondary">Run</button>
        </div>
        <div id="modeIndicator">Modus: Edit</div>

        <h2>Neues Objekt</h2>
        <div class="row">
            <button id="addTurnoutBtn">Weiche</button>
            <button id="addSwitchBtn">Schalt-Objekt</button>
        </div>

        <h2>Ausgewähltes Objekt</h2>
        <div id="selectedInfo" style="font-size:12px;min-height:40px;color:#aaa;">
            Nichts ausgewählt.
        </div>
        <div id="selectedControls" style="display:none;">
            <label>Name
                <input id="selName" type="text">
            </label>
            <label>Pin A / Pin B (Weiche) oder Pin (Schalter)</label>
            <div class="row">
                <input id="selPinA" type="number" placeholder="Pin A">
                <input id="selPinB" type="number" placeholder="Pin B / Pin">
            </div>
            <label>Emoji (Schalt-Objekt)
                <input id="selEmoji" type="text" placeholder="z.B. 💡">
            </label>
            <label>Impulsdauer (ms, optional)
                <input id="selPulse" type="number" min="50" max="200">
            </label>
            <div class="row">
                <button id="selStateA">Stellung A</button>
                <button id="selStateB">Stellung B</button>
            </div>
            <button id="selSave">Änderungen übernehmen</button>
        </div>

        <h2>Objekte</h2>
        <div id="objectList"></div>
    </div>

    <div id="footerBar">
        <button id="resetViewBtn" class="secondary">Ansicht zentrieren</button>
        <button id="allNormalBtn">Alle in Grundstellung</button>
    </div>
</div>

<script>
(function() {
    const canvas = document.getElementById('trackCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        draw();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- State ---
    let mode = 'edit'; // 'edit' | 'run'
    let arduinoIp = '';
    let globalPulse = 200;

    let objects = []; // Weichen + Schaltobjekte
    let selectedId = null;

    // einfache Kamera/Zoom
    let camX = 0, camY = 0, camScale = 1;

    const sidebar = document.getElementById('sidebar');
    const sidebarHandle = document.getElementById('sidebarHandle');

    sidebarHandle.addEventListener('click', () => {
        sidebar.classList.toggle('open');
    });

    document.getElementById('ipInput').addEventListener('change', e => {
        arduinoIp = e.target.value.trim();
    });
    document.getElementById('globalPulse').addEventListener('change', e => {
        const v = parseInt(e.target.value, 10);
        if (!isNaN(v)) globalPulse = Math.max(50, Math.min(200, v));
    });

    const modeIndicator = document.getElementById('modeIndicator');
    document.getElementById('editBtn').addEventListener('click', () => {
        mode = 'edit';
        modeIndicator.textContent = 'Modus: Edit';
    });
    document.getElementById('runBtn').addEventListener('click', () => {
        mode = 'run';
        modeIndicator.textContent = 'Modus: Run';
        selectedId = null;
        updateSelectionUI();
    });

    // --- Objekt-Erzeugung ---
    let nextId = 1;

    function addTurnout() {
        const id = nextId++;
        objects.push({
            id,
            type: 'turnout',
            name: 'Weiche ' + id,
            x: 100 + id * 10,
            y: 100 + id * 10,
            state: 'A', // A = gerade, B = abzweig
            pinA: 22,
            pinB: 23,
            pulseMs: globalPulse,
            linkedIds: [] // später für Kopplung
        });
        refreshObjectList();
        draw();
    }

    function addSwitch() {
        const id = nextId++;
        objects.push({
            id,
            type: 'switch',
            name: 'Schalter ' + id,
            x: 200 + id * 10,
            y: 150 + id * 10,
            state: false,
            pin: 30,
            emoji: '💡',
            mode: 'toggle'
        });
        refreshObjectList();
        draw();
    }

    document.getElementById('addTurnoutBtn').addEventListener('click', addTurnout);
    document.getElementById('addSwitchBtn').addEventListener('click', addSwitch);

    // --- Objektliste ---
    const objectList = document.getElementById('objectList');

    function refreshObjectList() {
        objectList.innerHTML = '';
        objects.forEach(o => {
            const div = document.createElement('div');
            div.className = 'objItem' + (o.id === selectedId ? ' active' : '');
            div.textContent = (o.type === 'turnout' ? 'Weiche ' : 'Schalter ') + o.id + ' – ' + o.name;
            div.addEventListener('click', () => {
                selectedId = o.id;
                updateSelectionUI();
                draw();
            });
            objectList.appendChild(div);
        });
    }

    // --- Auswahl-UI ---
    const selectedInfo = document.getElementById('selectedInfo');
    const selectedControls = document.getElementById('selectedControls');
    const selName = document.getElementById('selName');
    const selPinA = document.getElementById('selPinA');
    const selPinB = document.getElementById('selPinB');
    const selEmoji = document.getElementById('selEmoji');
    const selPulse = document.getElementById('selPulse');
    const selStateA = document.getElementById('selStateA');
    const selStateB = document.getElementById('selStateB');
    const selSave = document.getElementById('selSave');

    function getSelected() {
        return objects.find(o => o.id === selectedId) || null;
    }

    function updateSelectionUI() {
        const o = getSelected();
        refreshObjectList();
        if (!o) {
            selectedInfo.textContent = 'Nichts ausgewählt.';
